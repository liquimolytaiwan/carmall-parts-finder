name: deploy-pages

# Publishes the repo root to GitHub Pages using the Actions build path. The legacy Pages
# builder stopped dispatching for carmall-ngk-finder on 2026-08-06 with no log, so this
# repo starts on the path that leaves a readable log when something breaks.
#
# Plain static files, nothing to compile: upload the checkout and deploy it. A failed run
# leaves the previously deployed site serving untouched.
#
on:
  push:
    branches: [main]
  # refresh-data pushes with the default GITHUB_TOKEN, and GitHub never fires `push`
  # workflows for those pushes — that is how carmall-ngk-finder's live site sat on stale
  # data for two months in 2026. `workflow_run` is not subject to that rule.
  workflow_run:
    workflows: [refresh-data]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      simulate_missing_artifact:
        # Test hook for the retry below. GitHub's glitch can't be triggered on purpose, so
        # this makes the first attempt ask for an artifact name that doesn't exist — the
        # same "No artifacts named ..." throw in deploy-pages — and the retry then deploys
        # the real one. Push, schedule and workflow_run runs have no inputs, so it's off.
        description: "Test only: fail the first deploy attempt to exercise the retry"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # refresh-data also ends red after publishing a partial build (exit 3), and that data
    # is still newer than what is live — so deploy on failure too. data.json is checked
    # below either way. Only a cancelled run is skipped.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check each finder's data.json is present and parses
        # A finder is one fetch of its data.json; shipping a truncated or invalid one
        # renders an empty picker with no error the customer can act on.
        run: |
          python3 - <<'PY'
          import json, sys
          # tires: 23 models on 2026-11-10, 21 once the RS01+RS02 set is taken down (AEON STR 250/300
          # are listed only on the set page) — the floor sits below that.
          MIN_MODELS = {"filters": 100, "pads": 100, "tires": 15}
          for name, floor in MIN_MODELS.items():
              d = json.load(open(f"{name}/data.json"))
              models = sum(len(b["models"]) for b in d["brands"])
              print(f"{name}/data.json: {len(d['brands'])} brands, {models} models, generated {d['generated']}")
              if models < floor:
                  sys.exit(f"ERROR: {name} has only {models} models — data.json looks truncated")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        # GitHub sometimes reports `No artifacts named "github-pages"` for an artifact the
        # step above uploaded successfully (this repo twice on 2026-11-22, carmall-ngk-finder
        # on 2026-11-23). A fresh run always deployed fine, and a re-run of the same run
        # later counted 2 artifacts, so the run's artifact list does catch up — just not
        # within the ~0.5s between upload and deploy. A failed attempt here moves on to the
        # retry below instead of ending the run red (and emailing a failure).
        continue-on-error: true
        with:
          artifact_name: ${{ inputs.simulate_missing_artifact && 'no-such-artifact-retry-test' || 'github-pages' }}
          # The Pages deployment queue has backed up past the default 10-minute wait before
          # while the deploy itself succeeded; a red build for a shipped deploy erodes trust
          # in the signal.
          timeout: 1200000

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        # Nothing shows how long the artifact list takes to catch up, and this wait only
        # costs time on a run that would otherwise have failed, so it is generous. The
        # warning keeps a healed glitch visible on what is now a green run.
        run: |
          echo "::warning::First deploy attempt failed; retrying in 3 minutes (see the step above for the error)"
          sleep 180

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        # Deploy again from the artifact already uploaded — never re-upload: a second
        # upload in the same run makes deploy-pages fail with "Multiple artifacts named
        # github-pages". No continue-on-error here, so failing twice still ends red.
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
