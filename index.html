<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>車型對照查詢 | CarMall</title>
<meta name="description" content="先選擇要找的商品，再依您的車款查到適用規格並直接購買" />
<link rel="preconnect" href="https://www.carmall.com.tw" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="hub" id="hub">
  <header class="hub-head">
    <h1 class="hub-title">車型對照查詢</h1>
    <p class="hub-sub">先選擇要找的商品，再依您的車款查到適用規格並一鍵購買</p>
  </header>

  <!-- One card per live finder. Only list a category once its finder works end to end:
       every card on this page must lead somewhere a customer can finish a lookup.
       Finders are opened in this same frame with ?from=hub so they show a back link. -->
  <nav class="hub-grid" aria-label="選擇商品類別">
    <a class="hub-card" href="https://liquimolytaiwan.github.io/carmall-wiper-finder/?from=hub">
      <span class="hub-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19a13 13 0 0 1 18 0"/><path d="M12 19 19.5 7.5"/><circle cx="12" cy="19" r="1.3"/></svg>
      </span>
      <span class="hub-text">
        <span class="hub-name">雨刷 <em class="hub-tag">汽車</em></span>
        <span class="hub-desc">依車廠、車款、年份查前後擋尺寸</span>
      </span>
      <span class="hub-go" aria-hidden="true"></span>
    </a>

    <a class="hub-card" href="https://liquimolytaiwan.github.io/carmall-ngk-finder/?from=hub">
      <span class="hub-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9.5" y="2" width="5" height="4" rx="1"/><path d="M8 6h8v5H8z"/><path d="M10 11h4v6h-4z"/><path d="M12 17v3h3"/></svg>
      </span>
      <span class="hub-text">
        <span class="hub-name">火星塞 <em class="hub-tag">機車</em></span>
        <span class="hub-desc">依廠牌、車款、出廠年份查 NGK 規格</span>
      </span>
      <span class="hub-go" aria-hidden="true"></span>
    </a>
  </nav>

  <p class="hub-foot">
    各查詢器的資料來源與注意事項，請見該查詢器頁面下方說明。<br>
    價格與庫存每日同步，實際成交以商品頁面為準。
  </p>
</div>

<script src="hub.js"></script>
</body>
</html>
